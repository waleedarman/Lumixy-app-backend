# /etc/nginx/sites-available/lumixy-staging
# Replace server_name, root, and PHP-FPM socket to match the host.
# Document only — not installed by the app.

upstream lumixy_php {
    # Single node:
    server unix:/run/php/php8.3-fpm-lumixy.sock;
    # Multi-node example (uncomment / extend when you scale app servers):
    # server 10.0.0.11:9000;
    # server 10.0.0.12:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;

    # Redirect to HTTPS in real staging (certbot / managed TLS).
    # return 301 https://$host$request_uri;

    root /var/www/lumixy/backend/public;
    index index.php;

    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass lumixy_php;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* /\.(?!well-known).* {
        deny all;
    }

    # Do not proxy Bunny CDN assets through Laravel.
    # Mobile/web clients should use BUNNY_CDN_URL directly.
}
