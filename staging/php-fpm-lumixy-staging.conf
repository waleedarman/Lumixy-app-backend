; /etc/php/8.3/fpm/pool.d/lumixy.conf
; Tune pm.max_children using: (RAM available to PHP) / average worker RSS
; Document only — not installed by the app.

[lumixy]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-lumixy.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500

request_terminate_timeout = 60s
clear_env = no

php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 4M
php_admin_value[upload_max_filesize] = 4M
php_admin_flag[expose_php] = off
