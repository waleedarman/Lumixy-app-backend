; /etc/supervisor/conf.d/lumixy-worker.conf
; Document only — not installed by the app.
; Start: sudo supervisorctl reread && sudo supervisorctl update

[program:lumixy-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/lumixy/backend/artisan queue:work redis --sleep=1 --tries=3 --timeout=90 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/lumixy/backend/storage/logs/worker.log
stopwaitsecs=3600
